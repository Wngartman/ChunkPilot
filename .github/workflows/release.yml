name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New exact source-version tag, for example v1.0.0-rc.1 or v1.0.0
        required: true
        type: string
      release_commit:
        description: Exact public main commit to test, tag, and publish
        required: true
        type: string
      supersedes:
        description: Optional existing prerelease tag to mark superseded
        required: false
        default: ''
        type: string
      previous_release:
        description: Optional previous release installer to upgrade from without changing that release
        required: false
        default: ''
        type: string
      curseforge_service_endpoint:
        description: Accepted public HTTPS service origin only; empty disables application-service access
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test exact public commit
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      SUPERSEDES_TAG: ${{ inputs.supersedes }}
      PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release }}
      UPGRADE_FROM_TAG: ${{ inputs.previous_release || inputs.supersedes }}
      CURSEFORGE_SERVICE_ENDPOINT: ${{ inputs.curseforge_service_endpoint }}
      CHUNKPILOT_SIGNING_CERT_THUMBPRINT: ${{ secrets.CHUNKPILOT_SIGNING_CERT_THUMBPRINT }}

    steps:
      - name: Validate release request
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?\z') {
            throw 'Release tag must be an exact stable, alpha, beta, or release-candidate version.'
          }
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw 'release_commit must be a full lowercase Git commit SHA.'
          }
          if ($env:SUPERSEDES_TAG -and
              $env:SUPERSEDES_TAG -notmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?\z') {
            throw 'supersedes must be empty or an existing exact ChunkPilot release tag.'
          }
          if ($env:SUPERSEDES_TAG -eq $env:RELEASE_TAG) {
            throw 'A release cannot supersede itself.'
          }
          if ($env:PREVIOUS_RELEASE_TAG -and
              $env:PREVIOUS_RELEASE_TAG -notmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?\z') {
            throw 'previous_release must be empty or an existing exact ChunkPilot release tag.'
          }
          if ($env:PREVIOUS_RELEASE_TAG -eq $env:RELEASE_TAG) {
            throw 'A release cannot be its own previous-version upgrade test.'
          }
          if ($env:CURSEFORGE_SERVICE_ENDPOINT -cnotmatch '\A(?:|https://[a-z0-9-]+(?:\.[a-z0-9-]+)+(?::443)?/?)\z') {
            throw 'The service endpoint must be empty or a public HTTPS origin, never a credential or arbitrary build property.'
          }

      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Prove public main and immutable release identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_COMMIT) {
            throw "Checked-out HEAD $head differs from requested commit $env:RELEASE_COMMIT."
          }
          $mainRow = @(git ls-remote origin refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $mainRow.Count -ne 1) {
            throw 'Could not resolve the exact public main commit.'
          }
          $publicMain = ($mainRow[0] -split '\s+')[0]
          if ($publicMain -ne $env:RELEASE_COMMIT) {
            throw "Public main advanced to $publicMain; refusing to release stale commit $env:RELEASE_COMMIT."
          }

          $releaseResult = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" 2>&1
          $releaseExit = $LASTEXITCODE
          if ($releaseExit -eq 0) {
            throw 'This tag already has a GitHub release; immutable assets will not be replaced.'
          }
          if (($releaseResult -join "`n") -notmatch '\(HTTP 404\)') {
            throw "Could not prove that the release is unused: $($releaseResult -join ' ')"
          }
          $global:LASTEXITCODE = 0

          if ($env:SUPERSEDES_TAG) {
            $previous = gh api "repos/${{ github.repository }}/releases/tags/$env:SUPERSEDES_TAG" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $previous -or $previous.draft -or -not $previous.prerelease) {
              throw 'supersedes may edit only an existing public prerelease; use previous_release for stable upgrade tests.'
            }
          }

          $tagRows = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the remote release tag.' }
          if ($tagRows.Count -gt 0) {
            $peeled = @($tagRows | Where-Object { $_ -match '\^\{\}$' })
            if ($peeled.Count -ne 1 -or (($peeled[0] -split '\s+')[0]) -ne $env:RELEASE_COMMIT) {
              throw 'An existing tag is lightweight, ambiguous, or targets a different commit.'
            }
            git fetch --force origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0 -or (git cat-file -t "refs/tags/$env:RELEASE_TAG").Trim() -ne 'tag') {
              throw 'The existing remote tag is not an annotated tag.'
            }
            Write-Host 'Reusing an exact annotated tag left by an earlier publish-stage interruption.'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/ChunkPilot.WebUi/package-lock.json

      - name: Install verified repository-local Inno Setup
        shell: pwsh
        run: ./scripts/install-inno-setup.ps1

      - name: Validate private CurseForge service without credentials
        shell: pwsh
        working-directory: services/ChunkPilot.CurseForgeService
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Service dependency restore failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Service typecheck failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Service security tests failed.' }

      - name: Build, test, publish, and compile installer once
        shell: pwsh
        run: ./scripts/publish.ps1 -BuildInstaller -ReleaseTag $env:RELEASE_TAG -CurseForgeServiceEndpoint $env:CURSEFORGE_SERVICE_ENDPOINT

      - name: Test packaged Agent
        shell: pwsh
        run: ./scripts/smoke-portable.ps1 -PortableRoot ./artifacts/portable-test -CurseForgeServiceEndpoint $env:CURSEFORGE_SERVICE_ENDPOINT

      - name: Test packaged default UI close
        shell: pwsh
        run: ./scripts/test-packaged-ui-close.ps1 -PortableRoot ./artifacts/portable-test

      - name: Assemble checksums, metadata, notes, and release manifest
        shell: pwsh
        run: ./scripts/package-release.ps1 -ReleaseTag $env:RELEASE_TAG -CurseForgeServiceEndpoint $env:CURSEFORGE_SERVICE_ENDPOINT

      - name: Test portable ZIP from a clean extraction
        shell: pwsh
        run: ./scripts/test-portable-package.ps1 -PortableZip "./artifacts/release/$env:RELEASE_TAG/ChunkPilot-Portable-$env:RELEASE_TAG-win-x64.zip" -CurseForgeServiceEndpoint $env:CURSEFORGE_SERVICE_ENDPOINT

      - name: Download previous release installer for upgrade testing
        if: inputs.previous_release != '' || inputs.supersedes != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path artifacts/previous-release | Out-Null
          gh release download $env:UPGRADE_FROM_TAG --repo '${{ github.repository }}' `
            --pattern "ChunkPilot-Setup-$env:UPGRADE_FROM_TAG.exe" --dir artifacts/previous-release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous release installer.' }

      - name: Test clean install, prior-release upgrade, reinstall, uninstall, and data preservation
        shell: pwsh
        run: |
          $arguments = @{
            InstallerPath = "./artifacts/release/$env:RELEASE_TAG/ChunkPilot-Setup-$env:RELEASE_TAG.exe"
          }
          $previous = "./artifacts/previous-release/ChunkPilot-Setup-$env:UPGRADE_FROM_TAG.exe"
          if ($env:UPGRADE_FROM_TAG) {
            if (-not (Test-Path -LiteralPath $previous -PathType Leaf)) {
              throw 'The explicitly requested previous release installer is missing.'
            }
            $arguments.PreviousInstallerPath = $previous
          }
          ./scripts/test-installer.ps1 @arguments

      - name: Audit exact publication tree
        shell: pwsh
        run: |
          ./scripts/test-public-docs.ps1
          ./scripts/audit-publication.ps1

      - name: Verify clean source tree and whitespace
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $status = @(git status --porcelain)
          if ($status.Count -gt 0) {
            $status | ForEach-Object { Write-Host $_ }
            throw 'Release build changed tracked or unignored source files.'
          }

      - name: Upload the one verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chunkpilot-${{ inputs.tag }}-${{ inputs.release_commit }}
          path: artifacts/release/${{ inputs.tag }}/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Tag and publish the verified payload
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      SUPERSEDES_TAG: ${{ inputs.supersedes }}

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Download verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chunkpilot-${{ inputs.tag }}-${{ inputs.release_commit }}
          path: release

      - name: Validate payload and recheck public main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expected = @(
            "ChunkPilot-Setup-$env:RELEASE_TAG.exe",
            "ChunkPilot-Portable-$env:RELEASE_TAG-win-x64.zip",
            "ChunkPilot-Release-Metadata-$env:RELEASE_TAG.zip",
            'SHA256SUMS.txt', 'RELEASE_NOTES.md', 'release-manifest.json'
          )
          foreach ($asset in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path release $asset))) {
              throw "Missing verified asset: $asset"
            }
          }
          $manifest = Get-Content -LiteralPath release/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.Tag -ne $env:RELEASE_TAG -or $manifest.Commit -ne $env:RELEASE_COMMIT) {
            throw 'Verified payload manifest is not bound to the requested tag and commit.'
          }

          $mainRow = @(git ls-remote origin refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $mainRow.Count -ne 1) { throw 'Could not recheck public main.' }
          $publicMain = ($mainRow[0] -split '\s+')[0]
          if ($publicMain -ne $env:RELEASE_COMMIT) {
            throw "Public main advanced to $publicMain after testing; no tag or release was created."
          }

          $releaseResult = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" 2>&1
          $releaseExit = $LASTEXITCODE
          if ($releaseExit -eq 0) { throw 'The target release already exists.' }
          if (($releaseResult -join "`n") -notmatch '\(HTTP 404\)') {
            throw "Could not prove that the release is unused: $($releaseResult -join ' ')"
          }
          $global:LASTEXITCODE = 0

      - name: Create or prove exact annotated tag
        shell: pwsh
        run: |
          $tagRows = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the remote release tag.' }
          if ($tagRows.Count -eq 0) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $env:RELEASE_TAG $env:RELEASE_COMMIT -m "ChunkPilot $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Annotated tag creation failed.' }
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Annotated tag publication failed.' }
          }
          else {
            $peeled = @($tagRows | Where-Object { $_ -match '\^\{\}$' })
            if ($peeled.Count -ne 1 -or (($peeled[0] -split '\s+')[0]) -ne $env:RELEASE_COMMIT) {
              throw 'The existing tag is not the exact annotated tag expected for this release.'
            }
          }

      - name: Publish prerelease or stable release from the exact tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)(-(?<channel>alpha|beta|rc)\.(?<sequence>[1-9][0-9]*))?$') {
            throw 'Could not derive the public release title.'
          }
          $title = "ChunkPilot $($env:RELEASE_TAG.Substring(1))"
          # A singleton if result becomes a string unless typed; splatting that string emits characters.
          [string[]]$channelArguments = if ($env:RELEASE_TAG.Contains('-')) { @('--prerelease') } else { @('--latest') }
          $assets = @(
            "release/ChunkPilot-Setup-$env:RELEASE_TAG.exe",
            "release/ChunkPilot-Portable-$env:RELEASE_TAG-win-x64.zip",
            "release/ChunkPilot-Release-Metadata-$env:RELEASE_TAG.zip",
            'release/SHA256SUMS.txt'
          )
          gh release create $env:RELEASE_TAG @assets --repo '${{ github.repository }}' --verify-tag `
            @channelArguments --title $title --notes-file release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

      - name: Redownload and verify public assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($release.prerelease -ne $env:RELEASE_TAG.Contains('-') -or $release.draft) {
            throw 'Published release channel does not match its exact tag, or the release is still a draft.'
          }
          $expected = @(
            "ChunkPilot-Setup-$env:RELEASE_TAG.exe", "ChunkPilot-Portable-$env:RELEASE_TAG-win-x64.zip",
            "ChunkPilot-Release-Metadata-$env:RELEASE_TAG.zip", 'SHA256SUMS.txt'
          )
          $actual = @($release.assets | ForEach-Object name)
          if (@($expected | Where-Object { $_ -notin $actual }).Count -ne 0) {
            throw 'One or more public release assets are missing.'
          }
          New-Item -ItemType Directory -Path downloaded | Out-Null
          gh release download $env:RELEASE_TAG --repo '${{ github.repository }}' --dir downloaded
          if ($LASTEXITCODE -ne 0) { throw 'Public asset redownload failed.' }
          foreach ($line in Get-Content downloaded/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid SHA256SUMS line: $line" }
            $path = Join-Path downloaded $matches[2]
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing checksum target: $($matches[2])" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $matches[1]) { throw "Redownloaded asset hash mismatch: $($matches[2])" }
          }
          $metadata = "downloaded/ChunkPilot-Release-Metadata-$env:RELEASE_TAG.zip"
          Expand-Archive -LiteralPath $metadata -DestinationPath downloaded/metadata
          $build = Get-Content -LiteralPath downloaded/metadata/build-manifest.json -Raw | ConvertFrom-Json
          if ($build.ReleaseTag -ne $env:RELEASE_TAG -or $build.GitSha -ne $env:RELEASE_COMMIT) {
            throw 'Public release metadata does not identify the exact tested commit.'
          }
          "RELEASE_URL=$($release.html_url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified public release assets: $($release.html_url)"

      - name: Mark the previous prerelease superseded
        if: inputs.supersedes != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = gh api "repos/${{ github.repository }}/releases/tags/$env:SUPERSEDES_TAG" | ConvertFrom-Json
          if (-not $previous -or $previous.draft -or -not $previous.prerelease) {
            throw 'The superseded release is missing or not a public prerelease.'
          }
          $notice = "**Superseded by $env:RELEASE_TAG.**`n`nThis prerelease has been superseded by [$env:RELEASE_TAG]($env:RELEASE_URL). New users should install $env:RELEASE_TAG instead."
          $oldBody = [string]$previous.body
          if (-not $oldBody.StartsWith($notice, [StringComparison]::Ordinal)) {
            [IO.File]::WriteAllText('superseded-notes.md', $notice + "`n`n" + $oldBody,
              [Text.UTF8Encoding]::new($false))
            gh release edit $env:SUPERSEDES_TAG --repo '${{ github.repository }}' --notes-file superseded-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not mark the previous prerelease superseded.' }
          }

      - name: Record immutable release baseline
        shell: pwsh
        run: |
          $build = Get-Content -LiteralPath downloaded/metadata/build-manifest.json -Raw | ConvertFrom-Json
          $sums = @{}
          foreach ($line in Get-Content downloaded/SHA256SUMS.txt) {
            if ($line -match '^([0-9a-f]{64})  (.+)$') { $sums[$matches[2]] = $matches[1] }
          }
          @"
          ## Published hotfix baseline

          - Tag: ``$env:RELEASE_TAG``
          - Commit: ``$env:RELEASE_COMMIT``
          - Product: ``$($build.ProductVersion)``
          - Installer SHA-256: ``$($sums["ChunkPilot-Setup-$env:RELEASE_TAG.exe"])``
          - Portable SHA-256: ``$($sums["ChunkPilot-Portable-$env:RELEASE_TAG-win-x64.zip"])``
          - Release: $env:RELEASE_URL
          - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
