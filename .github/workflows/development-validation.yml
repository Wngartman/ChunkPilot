name: Development Validation

on:
  push:
    branches-ignore: [main]
    paths:
      - 'src/ChunkPilot.WebUi/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'scripts/test-public-docs.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: WebUI and public docs
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/ChunkPilot.WebUi/package-lock.json
      - name: Restore WebUI dependencies
        working-directory: src/ChunkPilot.WebUi
        run: npm ci
      - name: Typecheck, lint, test, and build WebUI
        working-directory: src/ChunkPilot.WebUi
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
      - name: Validate public documentation
        shell: pwsh
        run: ./scripts/test-public-docs.ps1
