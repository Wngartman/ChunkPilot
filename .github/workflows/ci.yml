name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      distribution:
        description: Also run installer, portable, and uninstall-preservation gates
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows release validation
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/ChunkPilot.WebUi/package-lock.json

      - name: Build and test WebUI
        shell: pwsh
        run: ./scripts/build-webui.ps1

      - name: Restore .NET dependencies
        shell: pwsh
        run: dotnet restore ./ChunkPilot.sln

      - name: Build Release solution
        shell: pwsh
        run: dotnet build ./ChunkPilot.sln -c Release --no-restore

      - name: Run .NET unit, integration, and migration tests
        shell: pwsh
        run: dotnet test ./ChunkPilot.sln -c Release --no-build -m:1 --logger "console;verbosity=minimal"

      - name: Audit public source and history
        shell: pwsh
        run: ./scripts/audit-publication.ps1

      - name: Check patch whitespace
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

  distribution:
    name: Disposable installer and portable validation
    if: github.event_name == 'workflow_dispatch' && inputs.distribution
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/ChunkPilot.WebUi/package-lock.json

      - name: Install verified repository-local Inno Setup
        shell: pwsh
        run: ./scripts/install-inno-setup.ps1

      - name: Build installer and portable layouts
        shell: pwsh
        run: ./scripts/publish.ps1 -BuildInstaller -ReleaseTag v1.3.0-alpha.1

      - name: Test packaged Agent and both UI launch modes
        shell: pwsh
        run: |
          ./scripts/smoke-portable.ps1 -PortableRoot ./artifacts/portable-test
          ./scripts/test-packaged-ui-close.ps1 -PortableRoot ./artifacts/portable-test
          ./scripts/test-packaged-ui-close.ps1 -PortableRoot ./artifacts/portable-test -WebUiPreview

      - name: Assemble and test portable release
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 -ReleaseTag v1.3.0-alpha.1
          ./scripts/test-portable-package.ps1 -PortableZip ./artifacts/release/v1.3.0-alpha.1/ChunkPilot-Portable-v1.3.0-alpha.1-win-x64.zip

      - name: Test clean install, reinstall, uninstall, and data preservation
        shell: pwsh
        run: ./scripts/test-installer.ps1 -InstallerPath ./artifacts/release/v1.3.0-alpha.1/ChunkPilot-Setup-v1.3.0-alpha.1.exe

      - name: Recheck publication tree and source cleanliness
        shell: pwsh
        run: |
          ./scripts/audit-publication.ps1
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          if (git status --porcelain) { throw 'Distribution validation changed tracked source files.' }
