name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows release validation
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/ChunkPilot.WebUi/package-lock.json

      - name: Build and test WebUI
        shell: pwsh
        run: ./scripts/build-webui.ps1

      - name: Restore .NET dependencies
        shell: pwsh
        run: dotnet restore ./ChunkPilot.sln

      - name: Build Release solution
        shell: pwsh
        run: dotnet build ./ChunkPilot.sln -c Release --no-restore

      - name: Run .NET unit, integration, and migration tests
        shell: pwsh
        run: dotnet test ./ChunkPilot.sln -c Release --no-build -m:1 --logger "console;verbosity=minimal"

      - name: Audit public source and history
        shell: pwsh
        run: ./scripts/audit-publication.ps1

      - name: Check patch whitespace
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
